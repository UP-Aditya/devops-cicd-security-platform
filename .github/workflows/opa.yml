name: OPA Policy Validation

on:
  push:
    branches:
      - development
      - staging
      - production

jobs:
  opa-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Run OPA Validation
        run: |
          opa eval "data"
